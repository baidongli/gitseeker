# GitSeeker - Nginx 子域名配置示例
#
# 用法：
#   cp deploy/nginx-gitseeker.conf /etc/nginx/conf.d/gitseeker.conf
#   把 gitseeker.example.com 改成你的实际域名
#   nginx -t && systemctl reload nginx

server {
    listen 80;
    listen [::]:80;
    server_name gitseeker.example.com;

    # 收藏导入需要上传 JSON，给点余量
    client_max_body_size 10M;

    # 防止泄露版本号
    server_tokens off;

    # 反代到 gunicorn unix socket
    location / {
        proxy_pass http://unix:/run/gitseeker/gunicorn.sock;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;

        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
    }

    # 可选：access/error log 分开放
    access_log /var/log/nginx/gitseeker-access.log;
    error_log  /var/log/nginx/gitseeker-error.log;
}
