<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}GitSeeker - 发现有趣的 GitHub 项目{% endblock %}</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-icons/1.11.3/font/bootstrap-icons.min.css">
  <style>
    :root {
      --bg: #0d1117;
      --surface: #161b22;
      --surface2: #21262d;
      --border: #30363d;
      --text: #e6edf3;
      --text-muted: #7d8590;
      --accent: #58a6ff;
      --accent-hover: #79c0ff;
      --green: #3fb950;
      --yellow: #d29922;
      --orange: #f0883e;
      --red: #f85149;
      --purple: #bc8cff;
    }
    body { background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    a { color: var(--accent); text-decoration: none; }
    a:hover { color: var(--accent-hover); text-decoration: underline; }

    /* Navbar */
    .navbar { background: var(--surface); border-bottom: 1px solid var(--border); }
    .navbar-brand { font-weight: 700; font-size: 1.25rem; color: var(--text) !important; }
    .navbar-brand span { color: var(--accent); }
    .nav-link { color: var(--text-muted) !important; font-size: 0.9rem; }
    .nav-link:hover, .nav-link.active { color: var(--text) !important; }
    .nav-link i { margin-right: 4px; }

    /* Cards */
    .repo-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 1.25rem;
      height: 100%;
      transition: border-color 0.15s, transform 0.15s;
      display: flex;
      flex-direction: column;
    }
    .repo-card:hover { border-color: var(--accent); transform: translateY(-2px); }
    .repo-card .repo-name { font-weight: 600; font-size: 1rem; color: var(--accent); }
    .repo-card .repo-name:hover { color: var(--accent-hover); }
    .repo-card .repo-owner { color: var(--text-muted); font-size: 0.85rem; }
    .repo-card .repo-desc { color: var(--text-muted); font-size: 0.875rem; line-height: 1.5; flex: 1; margin: 0.5rem 0; }
    .repo-card .repo-meta { display: flex; align-items: center; gap: 1rem; flex-wrap: wrap; margin-top: auto; }
    .repo-card .meta-item { display: flex; align-items: center; gap: 4px; font-size: 0.8rem; color: var(--text-muted); }
    .repo-card .meta-item i { font-size: 0.85rem; }
    .lang-dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
    .topic-badge {
      background: rgba(88, 166, 255, 0.1);
      color: var(--accent);
      border: 1px solid rgba(88, 166, 255, 0.3);
      border-radius: 20px;
      padding: 2px 10px;
      font-size: 0.75rem;
      white-space: nowrap;
    }
    .bookmark-btn { border: none; background: none; color: var(--text-muted); cursor: pointer; padding: 0; font-size: 1.1rem; transition: color 0.15s; }
    .bookmark-btn:hover, .bookmark-btn.active { color: var(--yellow); }
    .bookmark-btn.active i::before { content: "\F586"; } /* bi-bookmark-fill */

    /* Page header */
    .page-header { padding: 2rem 0 1.5rem; border-bottom: 1px solid var(--border); margin-bottom: 2rem; }
    .page-header h1 { font-size: 1.75rem; font-weight: 700; margin-bottom: 0.25rem; }
    .page-header p { color: var(--text-muted); margin: 0; }

    /* Filter bar */
    .filter-bar {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 1rem 1.25rem;
      margin-bottom: 1.5rem;
    }
    .filter-bar .form-control, .filter-bar .form-select {
      background: var(--surface2);
      border-color: var(--border);
      color: var(--text);
      font-size: 0.875rem;
    }
    .filter-bar .form-control:focus, .filter-bar .form-select:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(88, 166, 255, 0.2);
      background: var(--surface2);
      color: var(--text);
    }
    .filter-bar .form-control::placeholder { color: var(--text-muted); }
    .filter-bar .form-select option { background: var(--surface2); }

    /* Pills / tabs */
    .pill-group { display: flex; flex-wrap: wrap; gap: 8px; }
    .pill {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 4px 14px;
      font-size: 0.8rem;
      color: var(--text-muted);
      cursor: pointer;
      text-decoration: none;
      transition: all 0.15s;
    }
    .pill:hover { border-color: var(--accent); color: var(--accent); }
    .pill.active { background: var(--accent); border-color: var(--accent); color: #fff; }

    /* Avatar */
    .owner-avatar { width: 20px; height: 20px; border-radius: 50%; }

    /* Empty state */
    .empty-state { text-align: center; padding: 4rem 1rem; color: var(--text-muted); }
    .empty-state i { font-size: 3rem; margin-bottom: 1rem; display: block; opacity: 0.4; }

    /* Star counts */
    .stars-count { color: var(--yellow); }

    /* Buttons */
    .btn-primary { background: var(--accent); border-color: var(--accent); color: #000; font-weight: 600; }
    .btn-primary:hover { background: var(--accent-hover); border-color: var(--accent-hover); color: #000; }
    .btn-outline-secondary { border-color: var(--border); color: var(--text-muted); }
    .btn-outline-secondary:hover { background: var(--surface2); color: var(--text); border-color: var(--border); }

    /* Alert */
    .alert-warning { background: rgba(210, 153, 34, 0.15); border-color: var(--yellow); color: var(--yellow); }

    /* Footer */
    footer { border-top: 1px solid var(--border); margin-top: 4rem; padding: 1.5rem 0; color: var(--text-muted); font-size: 0.85rem; }

    /* Pagination */
    .pagination .page-link { background: var(--surface); border-color: var(--border); color: var(--text-muted); }
    .pagination .page-link:hover { background: var(--surface2); color: var(--text); }
    .pagination .page-item.active .page-link { background: var(--accent); border-color: var(--accent); color: #000; }
    .pagination .page-item.disabled .page-link { background: var(--surface); color: var(--text-muted); opacity: 0.5; }
  </style>
  {% block extra_head %}{% endblock %}
</head>
<body>
  <nav class="navbar navbar-expand-lg sticky-top">
    <div class="container">
      <a class="navbar-brand" href="{% url 'index' %}">
        <i class="bi bi-search-heart me-2"></i>Git<span>Seeker</span>
      </a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navMenu">
        <ul class="navbar-nav me-auto ms-3">
          <li class="nav-item">
            <a class="nav-link {% if request.resolver_match.url_name == 'index' %}active{% endif %}" href="{% url 'index' %}">
              <i class="bi bi-fire"></i>趋势
            </a>
          </li>
          <li class="nav-item">
            <a class="nav-link {% if request.resolver_match.url_name == 'search' %}active{% endif %}" href="{% url 'search' %}">
              <i class="bi bi-search"></i>搜索
            </a>
          </li>
          <li class="nav-item">
            <a class="nav-link {% if request.resolver_match.url_name == 'explore' %}active{% endif %}" href="{% url 'explore' %}">
              <i class="bi bi-compass"></i>探索
            </a>
          </li>
        </ul>
        <a class="nav-link {% if request.resolver_match.url_name == 'bookmarks' %}active{% endif %}" href="{% url 'bookmarks' %}">
          <i class="bi bi-bookmark-heart"></i>收藏
        </a>
      </div>
    </div>
  </nav>

  <main class="container py-4">
    {% if messages %}
      {% for message in messages %}
        <div class="alert alert-{{ message.tags }} alert-dismissible fade show" role="alert">
          {{ message }}
          <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
      {% endfor %}
    {% endif %}
    {% block content %}{% endblock %}
  </main>

  <footer>
    <div class="container text-center">
      数据来源 <i class="bi bi-github"></i> GitHub API &nbsp;·&nbsp; GitSeeker
    </div>
  </footer>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/js/bootstrap.bundle.min.js"></script>
  <script>
    // AJAX bookmark toggle
    document.addEventListener("click", function(e) {
      const btn = e.target.closest(".bookmark-btn");
      if (!btn) return;
      e.preventDefault();
      const url = btn.dataset.url;
      const csrfToken = document.querySelector("[name=csrfmiddlewaretoken]")?.value
        || getCookie("csrftoken");
      fetch(url, {
        method: "POST",
        headers: {"X-Requested-With": "XMLHttpRequest", "X-CSRFToken": csrfToken},
      }).then(r => r.json()).then(data => {
        btn.classList.toggle("active", data.bookmarked);
        const icon = btn.querySelector("i");
        icon.className = data.bookmarked ? "bi bi-bookmark-fill" : "bi bi-bookmark";
      });
    });
    function getCookie(name) {
      const v = document.cookie.match("(^|;)\\s*" + name + "\\s*=\\s*([^;]+)");
      return v ? v.pop() : "";
    }
  </script>
  {% csrf_token %}
  {% block extra_js %}{% endblock %}
</body>
</html>
